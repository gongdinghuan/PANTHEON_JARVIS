<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AI | Neural Interface</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Left Sidebar: Navigation & Controls -->
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-glitch" data-text="JARVIS">JARVIS</div>
                <div class="version">SYS.VER.4.0</div>
            </div>

            <!-- Live System Logs -->
            <div class="sidebar-logs-container">
                <div class="logs-header">SYSTEM LOGS</div>
                <div class="telemetry-stream" id="telemetryStream">
                    <div class="log-entry info">[SYSTEM] UI Initialized.</div>
                </div>
            </div>

            <div class="system-status-mini">
                <div class="status-row">
                    <span class="label">CPU</span>
                    <div class="bar-container">
                        <div class="bar-fill cpu-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="status-row">
                    <span class="label">MEM</span>
                    <div class="bar-container">
                        <div class="bar-fill mem-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="connection-state">
                    <span class="dot"></span>
                    <span class="text">ONLINE</span>
                </div>
            </div>
        </aside>

        <!-- Center: Main Chat Interface -->
        <main class="main-stage">
            <header class="chat-header">
                <div class="active-task-display" style="display: none;" id="taskStatus">
                    <span class="pulse-dot"></span>
                    <span class="task-text">EXECUTING PROTOCOL: <span id="currentTaskName">Analysis</span></span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="clearChatBtn" title="Purge Buffer">🗑️</button>
                </div>
            </header>

            <div class="chat-viewport" id="chatMessages">
                <div class="message system-message">
                    <div class="message-content">
                        <div class="hologram-effect"></div>
                        <p>JARVIS Neural Interface Initialized. Waiting for input...</p>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="typing-indicator" id="typingIndicator" style="display: none;">
                    <span></span><span></span><span></span>
                </div>
                <!-- Image Preview Strip -->
                <div class="image-preview-strip" id="imagePreviewStrip" style="display: none;"></div>
                <div class="input-wrapper">
                    <button class="upload-btn" id="uploadBtn" title="Upload Image">
                        <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
                            <path
                                d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <input type="file" id="imageFileInput" accept="image/*,.heic,.heif" multiple style="display: none;">
                    <input type="text" id="messageInput" placeholder="Enter command or query..." autocomplete="off">
                    <button class="send-btn" id="sendBtn">
                        <svg viewBox="0 0 24 24" fill="none" class="send-icon">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button class="voice-btn" id="voiceBtn">🎤</button>
                </div>
            </div>
        </main>


    </div>

    <!-- Modals -->
    <div class="modal-backdrop" id="settingsModal" style="display: none;">
        <div class="glass-modal">
            <div class="modal-header">
                <h2>SYSTEM CONFIGURATION</h2>
                <button class="close-modal" id="closeSettingsBtn">×</button>
            </div>
            <div class="modal-body">
                <!-- Settings content (same ID structure as before for compatibility) -->
                <div class="setting-group">
                    <label>Provider</label>
                    <select id="providerSelect">
                        <option value="openai">OpenAI</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="ollama">Ollama</option>
                        <option value="nvidia">NVIDIA</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="****************">
                </div>
                <div class="setting-group">
                    <label>Model</label>
                    <input type="text" id="modelInput" placeholder="gpt-4o">
                </div>
                <div class="setting-group">
                    <label>Base URL</label>
                    <input type="text" id="baseUrlInput">
                </div>
                <div class="modal-actions">
                    <button id="testBtn">TEST LINK</button>
                    <button id="saveConfigBtn" class="primary">SAVE CONFIG</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-backdrop" id="confirmationModal" style="display: none;">
        <div class="glass-modal warning">
            <div class="modal-header">
                <h2>⚠️ AUTHORIZATION REQUIRED</h2>
            </div>
            <div class="modal-body">
                <p id="confirmationMessage">Action requires approval.</p>
                <div id="confirmationTimer" class="timer-display">30s</div>
            </div>
            <div class="modal-actions">
                <button id="btnReject" class="danger">DENY</button>
                <button id="btnConfirm" class="success">AUTHORIZE</button>
            </div>
        </div>
    </div>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="vignette"></div>

    <!-- Use CDN for reliable library loading -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/echarts.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
